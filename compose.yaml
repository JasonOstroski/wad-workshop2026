services:
  shop:
    image: docker.io/library/node:22-alpine
    command: ["node", "/workshop/server.js"]
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      POSTGREST_URL: http://172.28.0.1:3000
      PAYMENT_URL: http://172.28.0.1:4004
    volumes:
      - ./:/workshop:ro
    depends_on:
      postgrest:
        condition: service_started
      payment:
        condition: service_healthy

  payment:
    image: docker.io/library/node:22-alpine
    command: ["node", "/workshop/payment.js"]
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
    volumes:
      - ./:/workshop:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4004/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgresql:
    image: docker.io/library/postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - workshop-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: docker.io/postgrest/postgrest:v12.2.12
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://shop:shop@172.28.0.1:5432/shop
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: workshop-only-secret
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
    depends_on:
      postgresql:
        condition: service_healthy

  load-generator:
    image: docker.io/grafana/k6:0.55.0
    profiles: [loadgen]
    command: ["run", "/scripts/smoke.js"]
    environment:
      TARGET_URL: http://shop:8088
      VUS: 10
      DURATION: 60s
    volumes:
      - ./loadgen/smoke.js:/scripts/smoke.js:ro
    depends_on:
      shop:
        condition: service_started

volumes:
  workshop-db:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1